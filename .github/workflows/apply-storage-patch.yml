name: Apply verified PR1 storage patch

on:
  push:
    branches: [codex/pr1-project-storage]
    paths: [.github/pr1-storage.patch.json]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'purinzan/native-usb-drum-pad' && github.ref == 'refs/heads/codex/pr1-project-storage'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and apply the reviewed source patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          original = subprocess.check_output(['git', 'rev-parse', 'HEAD:drum_pad_native.py'], text=True).strip()
          assert original == '5b160fc0ac34f10f29b8b125cb9a3cdc52b905ef', 'Base source changed; do not overwrite it'
          payload = json.loads(pathlib.Path('.github/pr1-storage.patch.json').read_text())
          patch = gzip.decompress(base64.b64decode(payload['gzip_base64'], validate=True))
          assert hashlib.sha256(patch).hexdigest() == payload['sha256'], 'Patch checksum mismatch'
          subprocess.run(['git', 'apply', '--check', '--whitespace=error'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--whitespace=error'], input=patch, check=True)
          PY
      - name: Check syntax and storage tests
        run: |
          python -m pip install platformdirs==4.10.0
          python -m py_compile *.py
          python -m unittest -v test_project_io
          git diff --check
      - name: Commit implementation only to the PR branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/pr1-storage.patch.json .github/workflows/apply-storage-patch.yml
          git add -- README.md app_paths.py project_io.py drum_pad_native.py requirements.txt test_drum_pad_native.py test_project_io.py test_project_storage_integration.py docs/STORAGE.md
          git commit -m 'Implement isolated storage, serialized saves and portable project bundles'
          git push origin HEAD:refs/heads/codex/pr1-project-storage
